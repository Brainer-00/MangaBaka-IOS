name: Flutter Quality Checks

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - '.github/readme-images/**'

  pull_request:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - '.github/readme-images/**'

permissions:
  contents: read

jobs:
  quality:
    name: Analyze and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Create test environment file
        run: |
          printf 'MANGABAKA_APP_CLIENT_ID=\n' > .env
          printf 'MANGABAKA_APP_REDIRECT_URI=io.github.brainer00.mangabaka-ios://oauthredirect\n' >> .env

      - name: Install dependencies
        run: flutter pub get

      - name: Verify application version metadata
        run: dart run tool/generate_app_version.dart --check

      - name: Verify formatting for changed Dart files
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_AFTER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          empty_tree="$(git hash-object -t tree /dev/null)"

          case "$EVENT_NAME" in
            pull_request)
              comparison=("$PR_BASE_SHA...$PR_HEAD_SHA")
              ;;
            push)
              if [[ "$PUSH_BEFORE_SHA" =~ ^0+$ ]] ||
                 ! git cat-file -e "$PUSH_BEFORE_SHA^{commit}" 2>/dev/null; then
                if git rev-parse --verify "$PUSH_AFTER_SHA^" >/dev/null 2>&1; then
                  base_sha="$PUSH_AFTER_SHA^"
                else
                  base_sha="$empty_tree"
                fi
              else
                base_sha="$PUSH_BEFORE_SHA"
              fi
              comparison=("$base_sha" "$PUSH_AFTER_SHA")
              ;;
            workflow_dispatch)
              if git rev-parse --verify "$GITHUB_SHA^" >/dev/null 2>&1; then
                base_sha="$GITHUB_SHA^"
              else
                base_sha="$empty_tree"
              fi
              comparison=("$base_sha" "$GITHUB_SHA")
              ;;
            *)
              echo "Unsupported event: $EVENT_NAME" >&2
              exit 1
              ;;
          esac

          printf 'Git comparison:'
          printf ' %s' "${comparison[@]}"
          printf '\n'

          mapfile -d '' -t dart_files < <(
            git diff --name-only --diff-filter=ACMR -z \
              "${comparison[@]}" -- '*.dart'
          )

          if (( ${#dart_files[@]} == 0 )); then
            echo 'No added, copied, modified, or renamed Dart files to check.'
            exit 0
          fi

          echo 'Dart files being checked:'
          printf '  %q\n' "${dart_files[@]}"
          dart format --output=none --set-exit-if-changed -- "${dart_files[@]}"

      - name: Analyze source
        run: flutter analyze

      - name: Run tests
        run: flutter test
