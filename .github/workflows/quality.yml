name: Flutter Quality Checks

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - '.github/readme-images/**'

  pull_request:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - '.github/readme-images/**'

permissions:
  contents: read

jobs:
  quality:
    name: Analyze and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Create test environment file
        run: |
          printf 'MANGABAKA_APP_CLIENT_ID=\n' > .env
          printf 'MANGABAKA_APP_REDIRECT_URI=io.github.brainer00.mangabaka-ios://oauthredirect\n' >> .env

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze source
        run: flutter analyze

      - name: Run tests
        run: flutter test
