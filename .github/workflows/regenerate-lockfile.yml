name: Regenerate Flutter Lockfile

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - 'pubspec.yaml'
      - '.github/workflows/regenerate-lockfile.yml'

permissions:
  contents: read

jobs:
  regenerate:
    name: Generate pubspec.lock
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Regenerate dependency lockfile
        run: flutter pub get

      - name: Upload pubspec.lock
        uses: actions/upload-artifact@v7
        with:
          name: regenerated-pubspec-lock
          path: pubspec.lock
          if-no-files-found: error
          retention-days: 1