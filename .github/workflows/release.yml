name: Release iOS Sideload IPA

on:
  workflow_dispatch:

  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and validate release IPA
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Select Xcode 26.6
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: '26.6'

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.5'
          cache: true

      - name: Show tool versions
        run: |
          flutter --version
          xcodebuild -version

      - name: Validate OAuth configuration
        env:
          MANGABAKA_CLIENT_ID: ${{ secrets.MANGABAKA_APP_CLIENT_ID }}
          MANGABAKA_REDIRECT_URI: ${{ secrets.MANGABAKA_APP_REDIRECT_URI }}
        run: |
          set -euo pipefail
          python3 <<'PY'
          import os
          import plistlib
          import re
          import unicodedata
          from pathlib import Path

          expected_redirect = 'io.github.brainer00.mangabaka-ios://oauthredirect'
          expected_scheme = 'io.github.brainer00.mangabaka-ios'
          client_id = os.environ.get('MANGABAKA_CLIENT_ID')
          redirect_uri = os.environ.get('MANGABAKA_REDIRECT_URI')

          if client_id is None or not client_id.strip():
              raise SystemExit('MANGABAKA_APP_CLIENT_ID is missing or empty.')
          if any(unicodedata.category(char).startswith('C') for char in client_id):
              raise SystemExit('MANGABAKA_APP_CLIENT_ID contains control characters.')
          if redirect_uri is None:
              raise SystemExit('MANGABAKA_APP_REDIRECT_URI is missing.')
          if redirect_uri != expected_redirect:
              raise SystemExit('MANGABAKA_APP_REDIRECT_URI is invalid.')

          with Path('ios/Runner/Info.plist').open('rb') as plist_file:
              plist = plistlib.load(plist_file)
          schemes = {
              scheme
              for url_type in plist.get('CFBundleURLTypes', [])
              for scheme in url_type.get('CFBundleURLSchemes', [])
          }
          if expected_scheme not in schemes:
              raise SystemExit('Info.plist does not register the OAuth URL scheme.')

          constants = Path('lib/core/constants/app_constants.dart').read_text(
              encoding='utf-8'
          )
          redirect_declarations = re.findall(
              r'''static\s+const\s+String\s+oauthRedirectUri\s*=\s*
                  (["'])([^"'\r\n]*)\1\s*;''',
              constants,
              re.VERBOSE,
          )
          if (
              len(redirect_declarations) != 1
              or redirect_declarations[0][1] != expected_redirect
          ):
              raise SystemExit('AppConstants oauthRedirectUri declaration is invalid.')
          PY

      - name: Create environment file
        env:
          MANGABAKA_CLIENT_ID: ${{ secrets.MANGABAKA_APP_CLIENT_ID }}
          MANGABAKA_REDIRECT_URI: ${{ secrets.MANGABAKA_APP_REDIRECT_URI }}
        run: |
          set -euo pipefail
          printf 'MANGABAKA_APP_CLIENT_ID=%s\n' "$MANGABAKA_CLIENT_ID" > .env
          printf 'MANGABAKA_APP_REDIRECT_URI=%s\n' "$MANGABAKA_REDIRECT_URI" >> .env

      - name: Parse and validate application version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          python3 <<'PY'
          import os
          import re
          from pathlib import Path

          pubspec = Path('pubspec.yaml').read_text(encoding='utf-8')
          matches = re.findall(r'^version:\s*([^\s#]+)\s*(?:#.*)?$', pubspec, re.MULTILINE)
          if len(matches) != 1:
              raise SystemExit(f'Expected one top-level version field, found {len(matches)}.')

          full_version = matches[0]
          parsed = re.fullmatch(
              r'(\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?)\+(\d+)',
              full_version,
          )
          if parsed is None:
              raise SystemExit('pubspec version must use semantic-version+numeric-build format.')

          version = parsed.group(1)
          build_number = parsed.group(2)
          if os.environ['EVENT_NAME'] == 'push':
              expected_tag = f'v{version}'
              if os.environ['REF_NAME'] != expected_tag:
                  raise SystemExit('Release tag does not match the pubspec semantic version.')

          with Path(os.environ['GITHUB_OUTPUT']).open('a', encoding='utf-8') as output:
              output.write(f'full_version={full_version}\n')
              output.write(f'version={version}\n')
              output.write(f'build_number={build_number}\n')
          PY

      - name: Install Flutter dependencies
        run: flutter pub get --enforce-lockfile

      - name: Verify application version metadata
        run: dart run tool/generate_app_version.dart --check

      - name: Verify formatting
        run: |
          set -euo pipefail
          git ls-files -z -- '*.dart' |
            xargs -0 dart format --output=none --set-exit-if-changed --

      - name: Analyze source
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Generate Drift code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Generate app icons
        run: dart run flutter_launcher_icons

      - name: Generate padded splash source
        run: dart run tool/generate_splash_asset.dart

      - name: Generate native splash assets
        run: dart run flutter_native_splash:create

      - name: Verify generated outputs are current
        run: |
          set -euo pipefail
          git diff --exit-code
          untracked="$(git ls-files --others --exclude-standard)"
          if [ -n "$untracked" ]; then
            echo 'Unexpected untracked non-ignored files were generated:' >&2
            printf '%s\n' "$untracked" >&2
            exit 1
          fi

      - name: Build unsigned iOS application
        run: flutter build ios --release --no-codesign

      - name: Verify build left tracked sources clean
        run: |
          set -euo pipefail
          git diff --exit-code
          untracked="$(git ls-files --others --exclude-standard)"
          if [ -n "$untracked" ]; then
            echo 'The iOS build produced unexpected untracked non-ignored files:' >&2
            printf '%s\n' "$untracked" >&2
            exit 1
          fi

      - name: Package, validate, and checksum IPA
        id: package
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BUILD_NUMBER: ${{ steps.version.outputs.build_number }}
        run: |
          set -euo pipefail

          app_path='build/ios/iphoneos/Runner.app'
          if [ ! -d "$app_path" ]; then
            echo 'Runner.app was not produced.' >&2
            exit 1
          fi

          package_root="$(mktemp -d "$RUNNER_TEMP/mangabaka-package.XXXXXX")"
          extract_root="$(mktemp -d "$RUNNER_TEMP/mangabaka-extract.XXXXXX")"
          entries_file="$RUNNER_TEMP/mangabaka-ipa-entries.txt"
          ipa_name="MangaBaka-iOS-v${VERSION}-unsigned.ipa"
          ipa_path="$RUNNER_TEMP/$ipa_name"
          checksum_path="$ipa_path.sha256"

          mkdir "$package_root/Payload"
          cp -R "$app_path" "$package_root/Payload/Runner.app"
          (
            cd "$package_root"
            zip -qry "$ipa_path" Payload
          )

          unzip -tq "$ipa_path"
          zipinfo -1 "$ipa_path" > "$entries_file"
          awk '
            /^\// || /(^|\/)\.\.(\/|$)/ || /(^|\/)__MACOSX(\/|$)/ ||
            /^Payload\/Payload(\/|$)/ || !/^Payload\// { exit 1 }
          ' "$entries_file"

          ditto -x -k "$ipa_path" "$extract_root"
          app_count="$(
            find "$extract_root/Payload" -mindepth 1 -maxdepth 1 \
              -type d -name '*.app' -print | wc -l | tr -d ' '
          )"
          if [ "$app_count" -ne 1 ]; then
            echo 'IPA must contain exactly one immediate Payload/*.app bundle.' >&2
            exit 1
          fi

          expected_app="$extract_root/Payload/Runner.app"
          actual_app="$(
            find "$extract_root/Payload" -mindepth 1 -maxdepth 1 \
              -type d -name '*.app' -print -quit
          )"
          if [ "$actual_app" != "$expected_app" ]; then
            echo 'IPA does not contain the expected Payload/Runner.app bundle.' >&2
            exit 1
          fi

          info_plist="$expected_app/Info.plist"
          test -f "$info_plist"
          plutil -lint "$info_plist"

          bundle_id="$(plutil -extract CFBundleIdentifier raw -o - "$info_plist")"
          short_version="$(plutil -extract CFBundleShortVersionString raw -o - "$info_plist")"
          build_version="$(plutil -extract CFBundleVersion raw -o - "$info_plist")"
          executable="$(plutil -extract CFBundleExecutable raw -o - "$info_plist")"

          test "$bundle_id" = 'io.github.brainer00.mangabaka-ios'
          test "$short_version" = "$VERSION"
          test "$build_version" = "$BUILD_NUMBER"
          test -n "$executable"
          test -f "$expected_app/$executable"
          test -x "$expected_app/$executable"
          test "$(basename "$ipa_path")" = "$ipa_name"

          (
            cd "$(dirname "$ipa_path")"
            shasum -a 256 "$ipa_name" > "${ipa_name}.sha256"
            shasum -a 256 -c "${ipa_name}.sha256"
          )

          printf 'ipa_path=%s\n' "$ipa_path" >> "$GITHUB_OUTPUT"
          printf 'checksum_path=%s\n' "$checksum_path" >> "$GITHUB_OUTPUT"

      - name: Upload release-candidate artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: MangaBaka-iOS-v${{ steps.version.outputs.version }}-unsigned
          path: |
            ${{ steps.package.outputs.ipa_path }}
            ${{ steps.package.outputs.checksum_path }}
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish GitHub Release
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Download validated release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: MangaBaka-iOS-v${{ needs.build.outputs.version }}-unsigned
          path: release-assets

      - name: Verify downloaded checksum
        run: |
          set -euo pipefail
          shopt -s nullglob
          ipa_files=(release-assets/*.ipa)
          checksum_files=(release-assets/*.ipa.sha256)
          if [ "${#ipa_files[@]}" -ne 1 ] || [ "${#checksum_files[@]}" -ne 1 ]; then
            echo 'Expected exactly one IPA and one SHA-256 checksum file.' >&2
            exit 1
          fi
          (
            cd release-assets
            shasum -a 256 -c "$(basename "${checksum_files[0]}")"
          )

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          ipa_files=(release-assets/*.ipa)
          checksum_files=(release-assets/*.ipa.sha256)
          gh release create "$GITHUB_REF_NAME" \
            "${ipa_files[0]}" \
            "${checksum_files[0]}" \
            --verify-tag \
            --generate-notes \
            --title "$GITHUB_REF_NAME"
